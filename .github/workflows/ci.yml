name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / components and installation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            generator: Ninja
            debug-preset: debug
          - os: macos-14
            generator: Ninja
            debug-preset: debug
          - os: windows-2022
            generator: Visual Studio 17 2022
            debug-preset: debug-windows

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev ninja-build clang-format-18

      - name: Check source formatting
        if: runner.os == 'Linux'
        run: >-
          find include/tos src tests examples -type f
          \( -name '*.h' -o -name '*.cpp' -o -name '*.cc' \)
          ! -path 'include/tos/vendor/*' -print0
          | xargs -0 -r clang-format-18 --dry-run --Werror

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 curl ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3);$(brew --prefix curl)" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install curl:x64-windows openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin" >> $env:GITHUB_PATH

      - name: Test five component combinations and relocated packages
        run: >-
          python tests/verify_components.py
          --work-dir build/components
          --generator "${{ matrix.generator }}"
          --config Release --jobs 2

      - name: Configure Debug
        run: python tests/run_logged.py build/logs/debug-configure.log cmake --preset ${{ matrix.debug-preset }}

      - name: Build Debug including independent public headers
        run: python tests/run_logged.py build/logs/debug-build.log cmake --build --preset ${{ matrix.debug-preset }}

      - name: Test Debug
        run: python tests/run_logged.py build/logs/debug-test.log ctest --preset ${{ matrix.debug-preset }}

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tos-${{ matrix.os }}-logs
          path: |
            build/components/*.log
            build/components/**/Testing/Temporary/LastTest.log
            build/logs/*.log
            build/debug*/CMakeFiles/CMakeConfigureLog.yaml
            build/debug*/Testing/Temporary/*.log

  sanitizers:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install instrumented-build tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev llvm-18 ninja-build
      - name: Configure TSan address space on this disposable runner
        if: matrix.preset == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure sanitizer
        run: python tests/run_logged.py build/logs/configure.log cmake --preset ${{ matrix.preset }}
      - name: Build libraries, fixtures, helpers and tests
        run: python tests/run_logged.py build/logs/build.log cmake --build --preset ${{ matrix.preset }}
      - name: Check fault detection, full suite and twenty lifetime repetitions
        run: python tests/run_logged.py build/logs/sanitizer-verification.log python tests/verify_sanitizers.py --preset ${{ matrix.preset }}
      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tos-${{ matrix.preset }}-logs
          path: |
            build/logs/*.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/sanitizer-logs/*.log
            build/${{ matrix.preset }}/Testing/Temporary/*.log
