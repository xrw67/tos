name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            configure_args: -DCMAKE_CXX_COMPILER=g++
          - os: macos-14
            configure_args: -DCMAKE_CXX_COMPILER=clang++
          - os: windows-2022
            configure_args: -G "Visual Studio 17 2022" -A x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and formatting dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev clang-format-18

      - name: Check source formatting
        if: runner.os == 'Linux'
        run: >-
          find include/tos src tests examples -type f
          \( -name '*.h' -o -name '*.cpp' -o -name '*.cc' \)
          ! -path 'include/tos/vendor/*' -print0
          | xargs -0 -r clang-format-18 --dry-run --Werror

      - name: Install OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Locate OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'C:\Program Files\OpenSSL-Win64'
          if (Test-Path "$root\include\openssl\evp.h") {
            "OPENSSL_ROOT_DIR=$root" >> $env:GITHUB_ENV
          }
          openssl version

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DTOS_BUILD_EXAMPLES=ON
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: tests
        run: ctest --test-dir build -C Release -L unit --output-on-failure --no-tests=error --timeout 30

      - name: Run example
        run: ctest --test-dir build -C Release -L example --output-on-failure --no-tests=error --timeout 30
